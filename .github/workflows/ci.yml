# Checks every push to main and every pull request: the solver (formatting, clippy, shellcheck, ruff and Biome on the scripts and page, tests, results
# byte-identical to the pinned references) and the page (built without game art, the browser suite's fast tier).
# The same ./build.sh steps a contributor runs (docs/BUILD.md).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  solver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pkg/loopopt
      - uses: actions/setup-node@v7
        with:
          node-version-file: webapp/package.json
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Lint (rustfmt, clippy native and wasm, shellcheck, ruff, Biome, tsc)
        run: ./build.sh lint
      - name: Clippy and the tests (cargo test, checks profile)
        run: ./build.sh native
      - name: Validation, byte-identical to the references (./build.sh val, then mono)
        run: |
          ./build.sh val ci
          ./build.sh mono

  page:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: webapp/package.json
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pkg/loopopt
          key: wasm
      - name: Playwright browsers (cached by the lockfile)
        uses: actions/cache@v6
        with:
          path: cache/ms-playwright
          key: playwright-${{ hashFiles('webapp/package-lock.json') }}
      - name: wasm-bindgen-cli (cached by the solver's lockfile, which pins its version)
        uses: actions/cache@v6
        with:
          path: cache/wasm-bindgen
          key: wasm-bindgen-${{ hashFiles('pkg/loopopt/Cargo.lock') }}
      - name: Build the solver's wasm and the page
        run: ./build.sh wasm page
      - name: Browsers and their system libraries
        run: |
          ./build.sh browsers
          (cd webapp && sudo npx playwright install-deps chromium)
      - name: Browser flows, Chromium, answered with the canned solver replies
        run: ./build.sh testq
      - name: The worker flow, on the real solver
        run: ./build.sh worker
