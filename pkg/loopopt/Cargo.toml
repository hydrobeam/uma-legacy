[package]
name = "loopopt"
version = "0.1.0"
edition = "2024"
description = "Legacy loop and support deck planner for Uma Musume's Independent Training: the solver behind the page"
license = "GPL-3.0-or-later"
readme = "../../README.md"
keywords = ["uma-musume", "planner", "optimization", "wasm"]
categories = ["games", "command-line-utilities", "wasm"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
# the game's integer codes as enums written as their integers (src/codes.rs; always with ts-rs's `repr(enum)`)
serde_repr = "=0.1.21"
# float_roundtrip: a float the solver printed parses back to the same bits (the page sends `next.fit` back, and the
# worker's kept state, src/career/state.rs)
serde_json = { version = "1", features = ["float_roundtrip"] }
# the page's TypeScript types of every report and job, generated from these structs (`./build.sh types`, docs/BUILD.md)
# (no-serde-warnings: ts-rs notes every serde attribute it does not read; here only `deserialize_with` checks, which
# keep the shape)
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }

# the native command line's arguments (src/cli.rs); not in the wasm
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }

# the page's worker calls the wasm through wasm-bindgen's generated glue (src/web.rs `Solver`; the host's clock and
# progress imports, career/clock.rs). Pinned exactly: `./build.sh wasm` runs wasm-bindgen-cli at this same version
# (read from Cargo.lock), which the glue's format requires. console_error_panic_hook: a panic's message reaches the
# console before the trap
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
console_error_panic_hook = "=0.1.7"

# build.rs reads the training-hint constants and the career planner's low-basis cost from research/results.json
[build-dependencies]
serde_json = "1"

# the planner's property test (tests/plan_monotone.rs): random small pools, shrunk to a minimal one on a failure; no
# default features (no forking, timeouts or regex strategies: the test uses none)
[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The checks' build (`cargo test`, val, valq, mono, lint; docs/BUILD.md, *Tests*): release's opt-level 3 without fat
# LTO and one codegen unit, which made each of the 21 test binaries a fat-LTO link of the whole crate (a cold release
# test build: 250 s and 1,470 CPU-s, against 55-94 s and 485-550 here; a rebuild after a one-line edit 31 s).
# Its outputs equal release's to the byte on val. debug_assert! and overflow checks are on, which release hides from
# the tests (valq identical with them; the solver runs 8-12% more instructions than release). The unit tests build here
# too: the dev profile (opt-level 1, dependencies 3) rebuilt them no faster after an edit (31 s against 34) and ran
# them slower (31 s against 25), and a second profile would compile the crate twice. The wasm and the release binary
# keep [profile.release].
[profile.checks]
inherits = "release"
# "off", not false: Cargo's false still runs thin LTO across the crate's own codegen units, 12 of a 44 s rebuild after
# a one-line edit; off makes that rebuild 7.7 s (opt-level 3 kept: opt-level 1 rebuilt no faster and ran tests slower)
lto = "off"
codegen-units = 16
incremental = true
debug-assertions = true
overflow-checks = true

# Clippy's default groups apply (no pedantic group); `./build.sh lint` denies every warning. Allowed here, crate-wide:
[lints.clippy]
# index loops mirror the maths (several arrays indexed together); iterator rewrites of hot loops are speed work
needless_range_loop = "allow"
# `!(x > 0.0)` is deliberate: it also catches NaN, which `x <= 0.0` would let through
neg_cmp_op_on_partial_ord = "allow"
# chunks_exact in the hot loops is tuned; moving to as_chunks is speed work (docs/PERF.md), not a lint fix
chunks_exact_to_as_chunks = "allow"
# the package sets description, license, readme, keywords and categories; it has no public repository URL to name
cargo_common_metadata = "allow"
# chosen beyond the default groups (pedantic, nursery and restriction lints, each named), denied:
# idioms
bool_to_int_with_if = "deny"
cast_lossless = "deny"
cloned_instead_of_copied = "deny"
default_trait_access = "deny"
deref_by_slicing = "deny"
elidable_lifetime_names = "deny"
explicit_iter_loop = "deny"
if_not_else = "deny"
if_then_some_else_none = "deny"
implicit_clone = "deny"
map_unwrap_or = "deny"
match_wildcard_for_single_variants = "deny"
missing_assert_message = "deny"
missing_const_for_fn = "deny"
needless_for_each = "deny"
redundant_closure_for_method_calls = "deny"
redundant_type_annotations = "deny"
semicolon_if_nothing_returned = "deny"
single_char_lifetime_names = "deny"
single_match_else = "deny"
uninlined_format_args = "deny"
unreadable_literal = "deny"
use_self = "deny"
wildcard_imports = "deny"
# sorting primitives: equal elements are indistinguishable, so the unstable sort gives the same order
stable_sort_primitive = "deny"
# guards: no stray debugging or placeholders, reasons on every allow, SAFETY notes on unsafe blocks, no iteration over
# a hash map's order, no panicking string slices or unwraps where a Result can carry the error, explicit Rc clones
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
iter_over_hash_type = "deny"
lossy_float_literal = "deny"
string_slice = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
# clones: none of a value its owner no longer needs, and clone_from where a clone overwrites an allocation (docs/BUILD.md,
# Ownership and clones)
assigning_clones = "deny"
redundant_clone = "deny"
# folders are name/mod.rs
self_named_module_files = "deny"

# no unsafe: wasm-bindgen's glue carries the wasm's exports and imports (web.rs, career/clock.rs)
[lints.rust]
unsafe_code = "deny"
