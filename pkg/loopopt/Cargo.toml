[package]
name = "loopopt"
version = "0.1.0"
edition = "2024"
description = "Legacy loop and support deck planner for Uma Musume's Independent Training: the solver behind the page"
license = "GPL-3.0-or-later"
readme = "../../README.md"
keywords = ["uma-musume", "planner", "optimization", "wasm"]
categories = ["games", "command-line-utilities", "wasm"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# build.rs reads the training-hint constants and the career planner's low-basis cost from research/results.json
[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Clippy's default groups apply (no pedantic group); `./build.sh lint` denies every warning. Allowed here, crate-wide:
[lints.clippy]
# index loops mirror the maths (several arrays indexed together); iterator rewrites of hot loops are speed work
needless_range_loop = "allow"
# `!(x > 0.0)` is deliberate: it also catches NaN, which `x <= 0.0` would let through
neg_cmp_op_on_partial_ord = "allow"
# chunks_exact in the hot loops is tuned; moving to as_chunks is speed work (docs/PERF.md), not a lint fix
chunks_exact_to_as_chunks = "allow"
# the package sets description, license, readme, keywords and categories; it has no public repository URL to name
cargo_common_metadata = "allow"
# chosen beyond the default groups (pedantic, nursery and restriction lints, each named), denied:
# idioms
bool_to_int_with_if = "deny"
cast_lossless = "deny"
cloned_instead_of_copied = "deny"
default_trait_access = "deny"
deref_by_slicing = "deny"
elidable_lifetime_names = "deny"
explicit_iter_loop = "deny"
if_not_else = "deny"
if_then_some_else_none = "deny"
implicit_clone = "deny"
map_unwrap_or = "deny"
match_wildcard_for_single_variants = "deny"
missing_assert_message = "deny"
missing_const_for_fn = "deny"
needless_for_each = "deny"
redundant_closure_for_method_calls = "deny"
redundant_type_annotations = "deny"
semicolon_if_nothing_returned = "deny"
single_char_lifetime_names = "deny"
single_match_else = "deny"
uninlined_format_args = "deny"
unreadable_literal = "deny"
use_self = "deny"
wildcard_imports = "deny"
# sorting primitives: equal elements are indistinguishable, so the unstable sort gives the same order
stable_sort_primitive = "deny"
# guards: no stray debugging or placeholders, reasons on every allow, SAFETY notes on unsafe blocks, no iteration over
# a hash map's order, no panicking string slices or unwraps where a Result can carry the error, explicit Rc clones
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
iter_over_hash_type = "deny"
lossy_float_literal = "deny"
string_slice = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
# clones: none of a value its owner no longer needs, and clone_from where a clone overwrites an allocation (docs/BUILD.md,
# Ownership and clones)
assigning_clones = "deny"
redundant_clone = "deny"
# folders are name/mod.rs
self_named_module_files = "deny"

# unsafe only where the wasm exports and imports need it (web.rs, and the host imports in career/clock.rs), each allowed
# there with its reason
[lints.rust]
unsafe_code = "deny"
