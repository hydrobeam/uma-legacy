[project]
name = "legacy-loop-planner-tools"
version = "0"
description = "Python side of the Legacy Loop Planner: master.mdb exporters, event builders, validation, image extraction"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "fonttools>=4.68.0",  # subsets /about's math font to the characters its formulas use (webapp/vite/mathfont.py)
    "brotli>=1.2.0",  # fonttools' woff2 writer
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "ruff>=0.17.1",
    "scipy-stubs==1.18.1.1",
    "shellcheck-py>=0.11.0.1",
]
research = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]
# the art steps only (./build.sh images, runners; webapp/icons.py): uv run --group art
art = [
    "UnityPy",   # reads the game's (already decrypted) asset bundles: card art and character icons
    "Pillow",    # resize and encode those images (AVIF, WebP)
]

[tool.ruff]
line-length = 120
extend-exclude = ["game"]

[tool.ruff.lint]
# pyflakes, syntax errors, bugbear, simplifications, comprehensions, pyupgrade, ruff's own
select = ["F", "E9", "B", "SIM", "C4", "UP", "RUF"]
ignore = [
  "B905",                        # zip(strict=...) would change behaviour where lengths differ on purpose
  "SIM115",                      # json.load(open(p)) in a script reads better than a with-block; nothing leaks that matters
  "RUF001", "RUF002", "RUF003",  # ×, ≤, − and the like are deliberate in strings, docstrings and comments
]

# the type checker (./build.sh lint, the pre-commit hook): pyright's standard rules over every Python tree but
# webapp/build.py (Vite replaces it), run with the research and art groups so numpy, scipy, UnityPy and Pillow resolve
[tool.basedpyright]
include = ["research", "val", "pkg/loopopt/export", "webapp/icons.py", "webapp/images.py", "webapp/chibi", "webapp/test"]
exclude = ["**/node_modules", "research/data"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
executionEnvironments = [
  # each tree as its scripts run it: val/sim's scripts put val/ on the path; val/ and research/ read export's gametora
  { root = "val/sim", extraPaths = ["val"] },
  { root = "val", extraPaths = ["pkg/loopopt/export", "research"] },
  { root = "research", extraPaths = ["pkg/loopopt/export", "val"] },
  { root = "pkg/loopopt/export" },
  { root = "webapp" },
]
