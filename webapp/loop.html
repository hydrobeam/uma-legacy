<!doctype html>
<html lang="en" class="game">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop planner · uma-legacy</title>
<meta name="description" content="Umamusume looping uma &amp; deck optimizer for Independent Training">
<meta name="theme-color" content="#e84898">
<meta property="og:site_name" content="uma-legacy">
<meta property="og:type" content="website">
<meta property="og:url" content="{{site}}/loop">
<meta property="og:title" content="Loop planner · uma-legacy">
<meta property="og:description" content="Pick your skills and get the best umas to loop and decks to run for Independent Training.">
<meta property="og:image" content="{{site}}/og.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:image:alt" content="Three sparkles in the spark colours: stat blue, aptitude pink, unique green">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://uma-legacy.pages.dev/loop">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
{{> theme}}
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
{{> preload}}
<a class="skip" href="#rcol">Skip to results</a>
<header class="top">
  <h1 class="brand" aria-label="uma-legacy">{{{logo}}}<span aria-hidden="true"><span class="bu">u</span><span class="bm">m</span><span class="ba">a</span>-legacy</span></h1>
  {{> nav current="loop"}}
</header>


<div class="wrap lp">
  <div class="lpside">
  <section class="rbbar" aria-labelledby="h-set">
    <h2 class="sethdr" id="h-set">Loop setup</h2>
    <div class="setlist">
{{> era}}
      {{> scen}}{{> rank}}
    </div>
    <div class="setenh">
{{> enh}}
    </div>
    <div class="rhead" id="rhead">
        <p class="runnote" id="run-note" role="status" aria-live="polite"></p>
        <span class="ract" id="r-act"></span>
        <label class="sw rauto" title="Automatically search 0.55s after a change"><input type="checkbox" role="switch" id="x-auto" checked>Auto-search</label>
      <label class="sw rper" title="Each uma gets the best deck for her own outfit and targets: better odds than one deck for the whole loop"><input type="checkbox" role="switch" id="c-peruma" checked>Deck per uma</label>
      </div>
  </section>
  <div class="lptgt">{{> skills}}</div>
  </div>

  <main class="rcol" id="rcol" tabindex="-1" aria-label="Results">
    <span class="rtop" id="rtop"></span>
    <div class="results" id="results"></div>
    <div id="pop-root"></div>
  </main>
  <button class="runpill" id="run-pill" type="button" hidden></button>
  <script>
  // phone (the columns stacked): the results come first, before the setup, in the reading and Tab order too; "rin": the
  // results are in view (loop/main.tsx keeps it current), which hides the floating status button
  (function () { var m = matchMedia('(max-width: 960px)'), w = document.querySelector('.wrap'), r = document.getElementById('rcol'), s = w.querySelector('.lpside');
    function place() { if (m.matches) w.prepend(r); else s.after(r); }
    place(); if (m.addEventListener) m.addEventListener('change', place); document.documentElement.classList.add('rin'); })();
  </script>
</div>

{{> dlgumas}}{{> dlgcards}}
<div id="why-root"></div>
<div id="sched-root"></div>
<div id="ex-root"></div>

<footer class="foot">
  <p class="row"><button class="btn" id="ex-open">Export / import settings</button><span class="hint" id="ver">Version {{version}}</span></p>
</footer>

<script type="module" src="/src/loop/main.tsx"></script>
